services:
  - type: web
    name: flam-study-assistant
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix server && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
